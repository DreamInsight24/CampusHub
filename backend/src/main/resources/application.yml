server:
  port: 8080

spring:
  application:
    name: campushub-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:campushub}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.campushub.util
  configuration:
    map-underscore-to-camel-case: true
