# Integration test profile - uses H2 in-memory database with MySQL compatibility mode
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:campushub_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Initialize schema from H2-compatible DDL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# MyBatis configuration (same as main, uses existing mapper XMLs)
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-handlers-package=com.campushub.util
mybatis.configuration.map-underscore-to-camel-case=true

# Disable WebSocket for tests
spring.websocket.enabled=false

# Server port (0 = random)
server.port=0
